# Mosquitto MQTT broker configuration for IoTmx

listener 1883
protocol mqtt

# Authentication — use password file generated with mosquitto_passwd
# Generate: docker run --rm eclipse-mosquitto:2 mosquitto_passwd -c /tmp/passwd <username>
# Copy the output to config/mosquitto_passwd
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Topic ACL — devices may only publish to their own telemetry topic
# Format: iot/<device_id>/telemetry
# The bridge service subscribes with admin credentials
acl_file /mosquitto/config/acl

# WebSocket listener (for browser clients / dashboards)
listener 9001
protocol websockets
